[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "severe-convective-radar-intelligence"
version = "0.1.0"
description = "Severe convective radar intelligence for archived Rainbow volumes"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
radar = [
  "numpy>=1.26",
  "xarray>=2024.10",
  "xradar>=0.8",
  "zarr>=3.1",
  "dask[array]>=2024.10",
]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
